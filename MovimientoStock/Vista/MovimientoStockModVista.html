<div class="displayBlock centrarContenido padding15">
    <div class="displayFlex centrarContenido">
        <h2 id="operacionMov">Nuevo Movimiento</h2>
    </div>
    <div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Cantidad</span>
            <input type="number" id="txtCantidadMov" class="inputText" placeholder="Cantidad">
        </div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Tipo de movimiento</span>
            <select name="" id="slcTipoMov" class="inputText">
                <option value="Entrada">Entrada</option>
                <option value="Salida">Salida</option>
            </select>
        </div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Motivo del Movimiento</span>
            <select name="" id="slcMotivoMov" class="inputText"></select>
        </div>
        <div class="" id="divErroresMov"></div>
        <div>
            <button id="btnMovNuevo" class="btnRelleno cabecera">Crear</button>
        </div>
    </div>
</div>
