<div class="displayBlock centrarContenido padding15">
    <div class="displayFlex centrarContenido">
        <h2 id="operacionUser">Operacion</h2>
    </div>
    <div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Nombre</span>
            <input type="text" id="txtNomProd" class="inputText" placeholder="Nombre">
        </div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Descripcion</span>
            <input type="text" id="txtDescProd" class="inputText" placeholder="Descripcion">
        </div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Codigo</span>
            <input type="text" id="txtTipoUser" class="inputText" placeholder="Codigo">
        </div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Tipo de Producto</span>
            <select id="slcTipoProd" class="inputText">
                <option value="">Vacio</option>
            </select>
        </div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Precio</span>
            <input type="text" id="txtPrecioCosto" class="inputText" placeholder="Costo">
            <input type="text" id="txtPrecioVenta" class="inputText" placeholder="Venta">
            <button id="btnModSPrecio" class="btnCrud cabecera">Modificar</button>
            <button id="btnHistPrecio" class="btnCrud cabecera">Historial</button>
        </div>
        <div class="borderDivInput marginBotton10">
            <span class="colorSec padding5">Stock</span>
            <input type="text" id="txtTipoUser" class="inputText" placeholder="Codigo">
            <button id="btnModStock" class="btnCrud cabecera">Modificar</button>
            <button id="btnMovsStock" class="btnCrud cabecera">Movimientos</button>
        </div>
        <div class="" id="divErroresUser"></div>
        <div>
            <button id="btnOpUser" class="btnRelleno cabecera">Crear</button>
        </div>
    </div>
</div>
